<!DOCTYPE html>
<html lang="en">

<head>
    <script src="coi-serviceworker.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>GBA Cloud Experiment</title>
    <style>
        :root {
            --primary: #7C4DFF;
            --bg: #050505;
            --surface: rgba(30, 30, 35, 0.6);
            --ui-size: clamp(44px, 6.5vw, 72px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            overflow: hidden;
        }

        #root {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-image: radial-gradient(circle at 50% 10%, #2a1a4a 0%, #000 60%);
        }

        .viewport-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .viewport {
            position: relative;
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 3/2;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
        }

        #game {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* ==========================================================================
           UPDATED FULLSCREEN STRETCH PATCH (FORCES EMULATOR.JS INTERNAL CANVAS TO FILL)
           ========================================================================== */
        .viewport:fullscreen,
        .viewport:-webkit-full-screen {
            max-width: none !important;
            width: 100vw !important;
            height: 100vh !important;
            aspect-ratio: auto !important;
            border-radius: 0 !important;
            padding: 0 !important;
        }

        /* Targets Emulator.js automatically generated structural elements, canvas, and parent wrappers */
        .viewport:fullscreen #game,
        .viewport:-webkit-full-screen #game,
        .viewport:fullscreen canvas,
        .viewport:-webkit-full-screen canvas,
        .viewport:fullscreen [id*="emulator"], 
        .viewport:-webkit-full-screen [id*="emulator"],
        .viewport:fullscreen .ejs-wrapper,
        .viewport:-webkit-full-screen .ejs-wrapper {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            min-width: 100vw !important;
            min-height: 100vh !important;
            object-fit: fill !important; /* Stretches the NDS visual viewport to all edges */
            inset: 0 !important;
            position: absolute !important;
        }

        .save-toolbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            transform: translateY(-100%);
            transition: transform 0.25s ease-in-out;
            z-index: 50;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .viewport:hover .save-toolbar,
        .save-toolbar:focus-within {
            transform: translateY(0);
        }

        .toolbar-group {
            display: flex;
            gap: 10px;
        }

        .toolbar-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .toolbar-btn:hover {
            background: var(--primary);
            border-color: transparent;
        }

        #launcher {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
            backdrop-filter: blur(18px);
            transition: opacity .35s ease, transform .35s ease;
        }

        .card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 20px;
            width: 92%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
        p { color: #cfcfcf; margin: 0 0 1rem; }

        .drop-zone {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .drop-zone.active, .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(124, 77, 255, 0.06);
        }

        .file-name {
            color: var(--primary);
            font-weight: 600;
            display: block;
            margin-top: 6px;
        }

        .btn-launch {
            background: #fff;
            color: #000;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            width: 100%;
            opacity: .6;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-launch.ready {
            opacity: 1;
            box-shadow: 0 10px 30px rgba(124, 77, 255, 0.12);
        }

        .touch-controls {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 1rem;
            gap: 1rem;
        }

        .dpad, .buttons {
            pointer-events: auto;
            display: flex;
            gap: .6rem;
            align-items: center;
        }

        .dpad {
            flex-direction: column;
            width: calc(var(--ui-size) * 2);
            height: calc(var(--ui-size) * 2);
            justify-content: center;
        }

        .dpad .row, .action-row, .small-row {
            display: flex;
            gap: .6rem;
            justify-content: center;
        }

        .control-btn {
            width: var(--ui-size);
            height: var(--ui-size);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            user-select: none;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
        }

        .control-btn:active {
            transform: scale(.98);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-large {
            width: calc(var(--ui-size) * 1.4);
            height: calc(var(--ui-size) * 1.4);
            border-radius: 16px;
        }

        .buttons {
            flex-direction: column;
            align-items: flex-end;
        }

        .hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        @media(min-width:900px) { .touch-controls { display: none; } }
        @media(max-width:420px) { :root { --ui-size: clamp(44px, 12vw, 64px); } }
    </style>
</head>
<body>
    <div id="root">
        <div class="viewport-wrap">
            <div class="viewport">
                <div class="save-toolbar">
                    <div class="toolbar-group">
                        <button class="toolbar-btn">Save State</button>
                        <button class="toolbar-btn">Load State</button>
                    </div>
                    <div class="toolbar-group">
                        <button class="toolbar-btn" onclick="toggleFullscreen()">Fullscreen</button>
                    </div>
                </div>
                <div id="game"></div>
                <div class="touch-controls">
                    <div class="dpad">
                        <div class="row"><div class="control-btn">↑</div></div>
                        <div class="row">
                            <div class="control-btn">←</div>
                            <div class="control-btn">→</div>
                        </div>
                        <div class="row"><div class="control-btn">↓</div></div>
                    </div>
                    <div class="buttons">
                        <div class="action-row">
                            <div class="control-btn btn-large">B</div>
                            <div class="control-btn btn-large">A</div>
                        </div>
                        <div class="small-row">
                            <div class="control-btn">SELECT</div>
                            <div class="control-btn">START</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="launcher">
            <div class="card">
                <h1>Fast Emulator Experiment</h1>
                <p>Emulator.js Layout Experiment</p>

                <div class="drop-zone" id="drop-game" onclick="document.getElementById('in-file').click()">
                    <span class="drop-label">TAP TO SELECT GAME</span>
                    <span class="file-name" id="label-game">No File Selected</span>
                </div>

                <input type="file" id="in-file" accept=".gba,.gb,.gbc,.nds,.zip" style="display:none;">
                <button class="btn-launch" id="btn-start" onclick="bootEngine()">START EMULATOR</button>
            </div>
        </div>
    </div>

    <script>
        window.EJS_player = '#game';
        window.EJS_core = 'nds'; 
        window.EJS_extLoadCore = 'melonds'; 
        window.EJS_pathtodata = 'data/'; 

        window.EJS_Settings = { "melonds_frameskip": "1" };
        let romFile = null;

        document.getElementById('in-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            romFile = file;
            document.getElementById('label-game').innerText = file.name;
            document.getElementById('btn-start').classList.add('ready');
        });

        function toggleFullscreen() {
            const container = document.querySelector('.viewport');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.log(`Error going fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function bootEngine() {
            if (!romFile) { alert("Please select a game ROM first!"); return; }
            window.EJS_gameUrl = URL.createObjectURL(romFile);
            document.getElementById('launcher').classList.add('hidden');

            const loaderScript = document.createElement('script');
            loaderScript.src = 'data/loader.js'; 
            document.head.appendChild(loaderScript);
        }
    </script>
</body>
</html>
